<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Web Media Parser</h1>
    <div id="status" class="status offline" aria-live="polite">Disconnected</div>
  </div>

  <div id="scan-section">
    <div class="scan-buttons">
      <button id="scan-btn" class="primary">Scan This Page</button>
      <button id="deep-crawl-btn" class="secondary" title="Send page URL to desktop app for recursive deep link traversal">Crawl Site in App ↗</button>
    </div>
    <div id="page-info" class="hidden"></div>
  </div>

  <div id="results" class="hidden">
    <div class="results-header">
      <span id="count">0 / 0 selected</span>
      <div class="results-controls">
        <select id="domain-filter" class="domain-filter">
          <option value="">All domains</option>
        </select>
        <select id="source-filter" class="domain-filter">
          <option value="">All sources</option>
          <option value="fullsize" selected>Full size</option>
          <option value="thumbnail">Thumbnails</option>
        </select>
        <label><input type="checkbox" id="select-all" checked> All</label>
      </div>
    </div>

    <div id="media-list"></div>

    <div class="actions">
      <div class="actions-left">
        <label class="concurrent-limit-label" for="concurrent-limit"
               title="How many files Chrome saves at the same time">Parallel:
          <input type="number" id="concurrent-limit" class="concurrent-limit-input"
                 min="1" max="10" value="2" aria-label="Parallel Chrome downloads">
        </label>
        <button type="button" id="copy-links-btn" class="link-btn"
                title="Copy selected (or all) media URLs to clipboard (Ctrl+Click to download .txt)">Copy Links</button>
      </div>
      <div class="actions-buttons">
        <button id="download-btn" class="primary" disabled
                title="Send the selected items to the desktop app queue">
          Download in App <span id="selected-count">0</span>
        </button>
        <button id="chrome-download-btn" class="save-green" disabled
                title="Save the selected files with Chrome's own downloader">
          Save in Chrome <span id="chrome-count">0</span>
        </button>
      </div>
    </div>
  </div>

  <div id="empty" class="hidden">
    <p>No media found on this page.</p>
  </div>

  <div class="footer">
    <div id="sieve-info" class="sieve-info" aria-live="polite"></div>
    <div class="sieve-actions">
      <input type="file" id="sieve-file" accept=".json" hidden>
      <button type="button" id="sieve-btn" class="link-btn"
              title="Load sieve rules from a JSON file on this computer">Load sieve rules…</button>
      <button type="button" id="sieve-update-btn" class="link-btn"
              title="Fetch the latest sieve rules online">Update now</button>
    </div>
  </div>

  <div id="error" class="hidden error"></div>

  <script src="../shared.js"></script>
  <script src="../sieve.js"></script>
  <script src="popup.js"></script>
</body>
</html>
